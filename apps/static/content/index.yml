features:
  title: Comprehensive Threat Intelligence
  description: Everything you need to evaluate the risk of an incoming connection, updated in real-time.
  items:
    - title: Full IP Lookup
      description: Enrich any IP with geolocation, ASN, proxy detection, Tor status, and threat intelligence via a single endpoint.
      icon: i-lucide-globe
      orientation: horizontal
      to: /full-ip-lookup
      target: _self
    - title: Proxy & VPN Detection
      description: Accurately identify residential proxies, datacenter IPs, and commercial VPN networks.
      icon: i-lucide-shield-alert
      to: /proxy-vpn-detection
      target: _self
    - title: Tor Exit Nodes
      description: Block or flag traffic originating from the Tor anonymity network.
      icon: i-lucide-eye-off
      to: /tor-exit-nodes
      target: _self
    - title: Granular Geolocation
      description: Receive highly accurate country, city, and timezone mapping to localize user experiences instantly.
      icon: i-lucide-map-pin
      to: /granular-geolocation
      target: _self
    - title: Threat Scoring System
      description: Combine multiple vectors into a single risk score to dynamically adjust login friction.
      icon: i-lucide-activity
      to: /threat-scoring-system
      target: _self
    - title: ASN & Carrier Data
      description: Retrieve the exact Autonomous System Number and internet service provider details behind any IP address.
      icon: i-lucide-server
      to: /asn-carrier-data
      target: _self
    - title: Disposable Email Check
      description: Instantly detect temporary, disposable, and free email domains to prevent spam signups.
      icon: i-lucide-mail
      to: /disposable-email-check
      target: _self
    - title: User Agent & Bot Parser
      description: Parse user agents and cross-verify IPs to identify legitimate search engine crawlers and flag malicious scrapers.
      icon: i-lucide-bot
      to: /user-agent-bot-parser
      target: _self
    - title: Verified Bots & Crawlers
      description: Identify legitimate search engine crawlers using official geofeeds without slow DNS lookups.
      icon: i-lucide-check-circle
      to: /verified-bots-crawlers
      target: _self
cta:
  title: Secure your app today
  description: Sign up for free and get 1000 requests per month, no credit card required.
  links:
    - label: Create Free Account
      to: /account
      external: true
      target: _self
      icon: i-lucide-user-plus
      size: xl
    - label: Docs
      to: /docs
      color: primary
      variant: subtle
      trailingIcon: i-lucide-arrow-right
      size: xl