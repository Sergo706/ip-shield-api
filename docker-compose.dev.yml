services:
  dashboard:
    build:
      target: development
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - .output/
            - .nuxt/
            - secrets/
            - docker/
            - .git/
        - action: rebuild
          path: apps/core/package.json
        - action: rebuild
          path: apps/shared/layer/package.json
        - action: rebuild
          path: pnpm-lock.yaml
    volumes:
      - app_node_modules:/app/node_modules
    read_only: false
    environment:
      NODE_ENV: development 
      HOST: 0.0.0.0 
      CHOKIDAR_USEPOLLING: "true" 
volumes:
  app_node_modules: