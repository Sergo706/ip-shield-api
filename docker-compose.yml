services:
  auth:
    container_name: ip-shield-auth
    image: sergio68/auth:latest
    pull_policy: if_not_present
    read_only: true  
    restart: unless-stopped
    cap_drop: ["ALL"]
    user: 10001:10001
    volumes: 
      - ./auth-logs/server:/app/auth-logs:rw
      - ./auth-logs/server/bot-detector:/app/bot-detector-logs:rw
      - bot-detector-data:/app/node_modules/@riavzon/bot-detector/dist/_data-sources:rw
      - email-data:/app/dist/email-db:rw
    tmpfs:
      - /run/app:rw,noexec,nosuid,nodev,uid=10001,gid=10001,size=1m
    pids_limit: 200
    depends_on:
      mysql:
        condition: service_healthy
    secrets:
      - age_key
      - encrypted_config
    security_opt:
      - "no-new-privileges:true"
    networks:
      backend:
        ipv4_address: 173.20.5.2
      egress: 
        ipv4_address: 173.22.20.2
  dashboard:
     container_name: ip-shield-dashboard
     image: ghcr.io/sergo706/ip-shield-dashboard:latest
     build:
      context: .
      dockerfile: ./docker/core/Dockerfile
      target: production
     pull_policy: never
     read_only: true  
     restart: unless-stopped
     cap_drop: ["ALL"] 
     user: 10001:10001
     security_opt: 
      - "no-new-privileges:true"
     tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=10001,gid=10001,size=64m
     volumes:
      - ./auth-logs/core-app:/app/apps/core/app-logs/:rw
      - data-sources:/app/data-sources:rw
      - data-sources-cache:/home/appuser/.shield-base:rw
     environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DOMAIN=localhost
      - CLIENT_LOG_DIR=/app/apps/core/app-logs
      - DATA_SOURCES_DIR=/app/data-sources
     depends_on:
       auth:
         condition: service_healthy
       mysql: 
          condition: service_healthy
     networks:
      frontend:
        ipv4_address: 173.21.10.5
      backend: 
       ipv4_address: 173.20.5.3
     secrets:
      - auth_crypto_cookies
      - auth_port_location
      - auth_server_location
      - hmac_client_id
      - hmac_shared_secret
      - oauth_github_client_id
      - oauth_github_client_secret
      - oauth_google_client_id
      - oauth_google_client_secret
      - turnstile
      - resend_api_key
      - mysql_user
      - mysql_password
      - mysql_database
      - age_key_app

  migrations:
     container_name: ip-shield-migrations
     image: ghcr.io/sergo706/ip-shield-migrations:latest
     profiles: ["cli"]
     build:
      context: .
      dockerfile: ./docker/core/Dockerfile
      target: development
     pull_policy: never
     read_only: false  
     restart: unless-stopped
     cap_drop: ["ALL"] 
     user: 10001:10001
     security_opt: 
      - "no-new-privileges:true"
     pids_limit: 200
     tmpfs:
      - /tmp
     volumes:
      - ./auth-logs/core-app:/app/apps/core/app-logs/:rw
     environment:
      - DB_HOST=mysql
      - DB_PORT=3306
     depends_on:
       mysql: 
          condition: service_healthy
       auth:
          condition: service_healthy
     networks:
      backend: 
       ipv4_address: 173.20.5.4
     secrets:
      - auth_crypto_cookies
      - auth_port_location
      - auth_server_location
      - hmac_client_id
      - hmac_shared_secret
      - oauth_github_client_id
      - oauth_github_client_secret
      - oauth_google_client_id
      - oauth_google_client_secret
      - turnstile
      - resend_api_key
      - mysql_user
      - mysql_password
      - mysql_database
      - age_key_app
  tunnel:
    container_name: cloudflared-tunnel
    image: ghcr.io/sergo706/ip-shield-tunnel:latest
    pull_policy: always
    read_only: true  
    cap_drop: ["ALL"]
    security_opt: 
      - "no-new-privileges:true"
    user: 10001:10001
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=10m,uid=10001,gid=10001
    build:
      context: .
      dockerfile: ./docker/tunnel/Dockerfile
    restart: unless-stopped
    networks:
      frontend:
        ipv4_address: 173.21.10.6
    secrets:
      - age_key_app
      - tunnel_token
      
  caddy:
    container_name: ip-shield-caddy
    image: ghcr.io/sergo706/ip-shield-caddy:latest
    build:
      context: .
      dockerfile: ./docker/caddy/Dockerfile
    restart: always
    security_opt: 
      - "no-new-privileges:true"
    read_only: true  
    cap_drop: ["ALL"]
    cap_add:
    - "NET_BIND_SERVICE"
    user: 10001:10001  
    ports:
    - "80:80"
    - "443:443"
    volumes:
      - ./secrets/caddy:/etc/caddy:ro 
      - caddy_data:/data
      - caddy_config:/config
    tmpfs: 
      - /tmp:rw,noexec,nosuid,nodev,size=2m,uid=10001,gid=10001,mode=0700    
    depends_on:
      dashboard:
        condition: service_healthy  
    networks:
      frontend:
        ipv4_address: 173.21.10.2
  alloy:
    container_name: ip-shield-alloy
    image: grafana/alloy:latest
    restart: unless-stopped
    networks:
      backend:
        ipv4_address: 173.20.5.5
      egress:
        ipv4_address: 173.22.20.5
    pid: host
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - ./auth-logs:/logs/apps:ro
      - /var/log:/logs/host:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      # TODO: complete config and age encryption image
  watchtower:
    container_name: watchtower
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/user/.docker/config.json:/config.json:ro 
    command: --interval 300 --cleanup
    restart: unless-stopped

  mysql: 
    container_name: ip-shield-mysql
    image: ghcr.io/sergo706/ip-shield-mysql:latest
    build: 
      context: .
      dockerfile: docker/mysql/Dockerfile
    restart: unless-stopped
    cap_drop: ["ALL"]
    user: "999:999"
    security_opt: 
      - "no-new-privileges:true"
    volumes:
      - sql_db_ip_shield:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/3306'"]
      interval: 10s
      timeout: 8s 
      retries: 5
      start_period: 7m
    secrets:
      - mysql_root_password
      - mysql_user
      - mysql_password  
      - mysql_database
      - age_key_app
    networks:
      backend:
        ipv4_address: 173.20.5.10  

secrets:
  age_key:
    file: ./secrets/auth/age_key
  encrypted_config:
    file: ./secrets/auth/config.json.age
  mysql_root_password:
    file: ./secrets/app/mysql/mysql_root_password.age
  mysql_user:
    file: ./secrets/app/mysql/mysql_user.age
  mysql_password:
    file: ./secrets/app/mysql/mysql_password.age 
  mysql_database:
    file: ./secrets/app/mysql/mysql_database.age
  age_key_app:
    file: ./secrets/age_key_app
  auth_crypto_cookies:
    file: ./secrets/app/env/auth_crypto_cookies.age
  auth_port_location:
    file: ./secrets/app/env/auth_port_location.age
  auth_server_location:
    file: ./secrets/app/env/auth_server_location.age
  hmac_client_id:
    file: ./secrets/app/env/hmac_client_id.age
  hmac_shared_secret:
    file: ./secrets/app/env/hmac_shared_secret.age
  oauth_github_client_id:
    file: ./secrets/app/env/oauth_github_client_id.age
  oauth_github_client_secret:
    file: ./secrets/app/env/oauth_github_client_secret.age
  oauth_google_client_id:
    file: ./secrets/app/env/oauth_google_client_id.age
  oauth_google_client_secret:
    file: ./secrets/app/env/oauth_google_client_secret.age
  turnstile:
    file: ./secrets/app/env/turnstile.age
  resend_api_key:
    file: ./secrets/app/env/resend_api_key.age
  tunnel_token:
    file: ./secrets/app/env/tunnel_token.age

volumes:
  sql_db_ip_shield:  
  app_data:
  bot-detector-data:
  email-data:
  caddy_data:
  caddy_config:
  data-sources:
  data-sources-cache:
networks: 
  backend: 
    internal: true
    enable_ipv6: false
    ipam:
      config:
        - subnet: 173.20.0.0/16
          ip_range: 173.20.5.0/24
          gateway: 173.20.5.1
  frontend:
    enable_ipv6: false
    ipam:
      config:
        - subnet: 173.21.10.0/24
          gateway: 173.21.10.1
  egress:
    internal: false
    enable_ipv6: false
    ipam:
      config:
        - subnet: 173.22.20.0/24
          gateway: 173.22.20.1